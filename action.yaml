---
name: "Frenck's Home Assistant Core Configuration Check"

description: 🚀 Frenck's GitHub Action for running a Home Assistant config check.

author: frenck

branding:
  color: red
  icon: thumbs-up

inputs:
  path:
    description: Path to the folder containing the Home Assistant configuration
    default: "."
    required: false

  secrets:
    description: Alternative secrets file to use
    required: false

  version:
    description: Version to use; dev/beta/stable or a specific version number
    required: false

  env_file:
    description: Possible path to environment file to use
    required: false

runs:
  using: composite
  steps:
    - name: 🏗 Check if the configuration is actually there
      id: check
      shell: bash
      run: |
        path="${{ inputs.path }}"
        path="${path%/}"

        if [[ ! -d "${path}" ]]; then
          echo "::error ::Could not find specified configuration path: ${path}"
          exit 1
        fi

        if [[ ! -f "${path}/configuration.yaml" ]]; then
          echo "::error ::Could not find configuration.yaml file in: ${path}"
          exit 1
        fi

        echo "path=${path}" >> "$GITHUB_OUTPUT"

    - name: 🏗 Ensure secrets are in place
      shell: bash
      run: |
        if [[ -z "${{ inputs.secrets }}" ]]; then
          exit 0
        fi

        secrets="${{ inputs.secrets }}"
        secrets="${secrets%/}"

        if [[ -d "${secrets}" ]] && [[ -f "${secrets}/secrets.yaml" ]]; then
          secrets="${secrets}/secrets.yaml"
        elif [[ -d "${{ steps.check.outputs.path }}/${secrets}" ]] && \
          [[ -f "${{ steps.check.outputs.path }}/${secrets}/secrets.yaml" ]]; then
          secrets="${{ steps.check.outputs.path }}/${secrets}/secrets.yaml"
        elif [[ -f "${{ steps.check.outputs.path }}/${secrets}" ]]; then
          secrets="${{ steps.check.outputs.path }}/${secrets}"
        elif [[ ! -f "${secrets}" ]]; then
          echo "::error ::Could not find specified secrets file: ${{ inputs.secrets }}"
          exit 1
        fi

        cp "${secrets}" "${{ steps.check.outputs.path }}/secrets.yaml"

    - name: 🏗 Determine & download requested Home Assistant version
      id: version
      shell: bash
      run: |
        version="${{ inputs.version }}"

        if [[ -z "${version}" ]]; then
          if [[ -f "${{ steps.check.outputs.path }}/.HA_VERSION" ]]; then
            version=$(<"${{ steps.check.outputs.path }}/.HA_VERSION")
          else
            echo "::warning ::No specific version found or specified; Using 'stable' instead. Specify the version in the GitHub Action or ensure the '.HA_VERSION' file is in your repository."
            version="stable"
          fi
        fi

        echo "version=${version}" >> "$GITHUB_OUTPUT"
        docker pull -q "ghcr.io/home-assistant/home-assistant:${version}"

    - name: 🏗 Register Home Assistant problem matcher
      shell: bash
      run: |
        matcher="${{ github.action_path }}/matcher.json"
        echo "::add-matcher::${matcher}"

    - name: 🚀 Run Home Assistant Configuration Check
      shell: bash
      # yamllint disable rule:line-length
      run: |
        set -euo pipefail

        # Resolve the NAS-visible host path for this job's workspace mount.
        host_workspace="$(
          docker inspect --format \
            '{{range .Mounts}}{{printf "%s|%s\n" .Destination .Source}}{{end}}' \
            "$HOSTNAME" |
            awk -F'|' -v workspace="$GITHUB_WORKSPACE" \
              '$1 == workspace { print $2; exit }'
        )"
        
        if [[ -z "$host_workspace" ]]; then
          echo "::error ::Could not find the host-side Docker mount for GITHUB_WORKSPACE ($GITHUB_WORKSPACE)"
          exit 1
        fi
        
        echo "Host workspace: $host_workspace"

        config_path="${{ steps.check.outputs.path }}"
        config_path="${config_path#./}"

        if [[ "$config_path" == "." || -z "$config_path" ]]; then
          container_config="/github/workspace"
        else
          container_config="/github/workspace/${config_path#/}"
        fi

        docker run --rm \
          --entrypoint "" \
          "ghcr.io/home-assistant/home-assistant:${{ steps.version.outputs.version }}" \
          python -m homeassistant --version

        env_file_args=()
        env_file="${{ inputs.env_file }}"

        if [[ -n "$env_file" ]]; then
          env_file="${env_file#./}"

          if [[ -f "$host_workspace/$env_file" ]]; then
            env_file_args=(--env-file "$host_workspace/$env_file")
          elif [[ -f "$GITHUB_WORKSPACE/$env_file" ]]; then
            echo "::error ::The env_file exists in the job container but its host-side path could not be resolved"
            exit 1
          fi
        fi

        mkdir -p "$GITHUB_WORKSPACE/share/nginx_assets"

        docker run --rm \
          --entrypoint "" \
          --mount "type=bind,src=${host_workspace},dst=/github/workspace,readonly" \
          --mount "type=bind,src=${host_workspace}/share,dst=/share,readonly" \
          "${env_file_args[@]}" \
          --workdir /github/workspace \
          "ghcr.io/home-assistant/home-assistant:${{ steps.version.outputs.version }}" \
          python -m homeassistant \
          --config "$container_config" \
          --script check_config
